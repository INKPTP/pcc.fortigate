- name: "Ansible uri : GET fqdn object - {{ rule_item.fqdn }}"
  ansible.builtin.uri:
    url: "{{ cred_rama6_fortigate_url if rule.site == 'Rama6' else cred_pttn_fortigate_url }}cmdb/firewall/address?vdom={{ rule.vdom }}&filter==fqdn=@{{ rule_item.fqdn }}&filter==associated-interface=={{ rule.firewall_rule.incoming_interface | replace(' ','%20') if 'source' in action_tasks else rule.firewall_rule.outgoing_interface | replace(' ','%20') }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cred_rama6_fortigate_api_token if rule.site == 'Rama6' else cred_pttn_fortigate_api_token }}"
    status_code: 200
    timeout: 60
    validate_certs: false
  register: existing_fqdn_address
  
- name: "Append fqdn object name into srcaddr - 1st"
  ansible.builtin.set_fact:
    srcaddr: "{{ srcaddr + [{'name': existing_fqdn_address.json.results[0].name}] }}"
  when: 
    - "'source' in action_tasks" 
    - existing_fqdn_address.json.results != []

- name: "Append fqdn object name into dstaddr - 1st"
  ansible.builtin.set_fact:
    dstaddr: "{{ dstaddr + [{'name': existing_fqdn_address.json.results[0].name}] }}"
  when: 
    - "'destination' in action_tasks" 
    - existing_fqdn_address.json.results != []

- name: "Ansible uri : GET fqdn object - {{ rule_item.fqdn }}"
  ansible.builtin.uri:
    url: "{{ cred_rama6_fortigate_url if rule.site == 'Rama6' else cred_pttn_fortigate_url }}cmdb/firewall/address?vdom={{ rule.vdom }}&filter==fqdn=@{{ rule_item.fqdn }}&filter==associated-interface=="
    method: GET
    headers:
      Authorization: "Bearer {{ cred_rama6_fortigate_api_token if rule.site == 'Rama6' else cred_pttn_fortigate_api_token }}"
    status_code: 200
    timeout: 60
    validate_certs: false
  register: existing_fqdn_address_no_interface
  when: existing_fqdn_address.json.results == []
  
- name: "Append fqdn object name into srcaddr - 2nd"
  ansible.builtin.set_fact:
    srcaddr: "{{ srcaddr + [{'name': existing_fqdn_address_no_interface.json.results[0].name}] }}"
  when: 
    - "'source' in action_tasks" 
    - existing_fqdn_address_no_interface is not skipped
    - existing_fqdn_address_no_interface.json.results != []

- name: "Append fqdn object name into dstaddr - 2nd"
  ansible.builtin.set_fact:
    dstaddr: "{{ dstaddr + [{'name': existing_fqdn_address_no_interface.json.results[0].name}] }}"
  when: 
    - "'destination' in action_tasks" 
    - existing_fqdn_address_no_interface is not skipped
    - existing_fqdn_address_no_interface.json.results != []

- name: "Ansible uri : POST create fqdn object - {{ rule_item.fqdn }}"
  ansible.builtin.uri:
    url: "{{ cred_rama6_fortigate_url if rule.site == 'Rama6' else cred_pttn_fortigate_url }}cmdb/firewall/address?vdom={{ rule.vdom }}"
    method: POST
    headers:
      Authorization: "Bearer {{ cred_rama6_fortigate_api_token if rule.site == 'Rama6' else cred_pttn_fortigate_api_token }}"
    body_format: json
    body:
      json:    
        name: "{{ rule_item.fqdn }}"
        type: "fqdn"
        fqdn: "{{ rule_item.fqdn }}"
    status_code: 200
    timeout: 60
    validate_certs: false
    return_content: true
  register: new_fqdn_address_response
  when: 
    - existing_fqdn_address.json.results == []
    - existing_fqdn_address_no_interface is skipped or existing_fqdn_address_no_interface.json.results == []

- name: "Append new fqdn object name into srcaddr"
  ansible.builtin.set_fact:
    srcaddr: "{{ srcaddr + [{'name': rule_item.fqdn}] }}"
  when: 
    - "'source' in action_tasks" 
    - new_fqdn_address_response is not skipped
    - new_fqdn_address_response.status == 200

- name: "Append new fqdn object name into dstaddr"
  ansible.builtin.set_fact:
    dstaddr: "{{ dstaddr + [{'name': rule_item.fqdn}] }}"
  when: 
    - "'destination' in action_tasks" 
    - new_fqdn_address_response is not skipped
    - new_fqdn_address_response.status == 200

- name: "Stop workflow if failed to create fqdn object - {{ rule_item.fqdn }}"
  ansible.builtin.fail:
    msg: "Failed to create fqdn object - {{ rule_item.fqdn }}"
  when: 
    - existing_fqdn_address.json.results == []
    - existing_fqdn_address_no_interface is skipped or existing_fqdn_address_no_interface.json.results == []
    - new_fqdn_address_response is not skipped
    - new_fqdn_address_response.status != 200