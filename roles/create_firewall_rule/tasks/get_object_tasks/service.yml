- name: "Ansible uri : GET service object - {{ rule_item }}"
  ansible.builtin.uri:
    url: "{{ cred_url }}cmdb/firewall.service/custom?vdom={{ rule.vdom }}&filter=tcp-portrange=={{ rule_item.split('/')[1] }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cred_api_token }}"
    status_code: 200
    timeout: 60
    validate_certs: false
  register: existing_service_object
  when:
    - rule_item != "ANY" 

- name: "Append service object name"
  ansible.builtin.set_fact:
    service: "{{ service + [{'name': existing_service_object.json.results[0].name}] }}"
  when:
    - existing_service_object.json.results != []
    - rule_item != "ANY" 

- name: "Ansible uri : POST create service object - {{ rule_item }}"
  ansible.builtin.uri:
    url: "{{ cred_url }}cmdb/firewall.service/custom?vdom={{ rule.vdom }}"
    method: POST
    headers:
      Authorization: "Bearer {{ cred_api_token }}"
    body_format: json
    body: "{{ lookup('template', '../templates/service_object_payload/service_object_payload.j2') }}"
    status_code: 200
    timeout: 60
    validate_certs: false
    return_content: true
  register: new_service_object_response
  vars:
    service_name: "{{ rule_item | replace('/','_') | string }}"
    service_port: "{{ rule_item.split('/')[1] | string }}"
  when: 
    - existing_service_object.json.results == []
    - rule_item != "ANY" 

- name: "Set fact new service object name"
  ansible.builtin.set_fact:
    service: "{{ service + [{'name': rule_item | replace('/','_')}] }}"
  when: 
    - existing_service_object.json.results == []
    - new_service_object_response.status == 200
    - rule_item != "ANY"

- name: "Set fact 'ALL' service object name"
  ansible.builtin.set_fact:
    service: "{{ service + [{'name': 'ALL'}] }}"
  when: 
    - existing_service_object.json.results == []
    - new_service_object_response.status == 200
    - rule_item == "ANY"

