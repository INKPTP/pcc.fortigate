- name: "Ansible uri : GET service object - {{ rule_item }}"
  ansible.builtin.uri:
    url: "{{ cred_url }}cmdb/firewall.service/custom?vdom={{ rule.vdom }}&filter={{ 'tcp' if 'TCP' in rule_item else 'udp' }}-portrange=={{ rule_item.split('/')[1] | regex_replace('^0+', '') }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cred_api_token }}"
    status_code: 200
    timeout: 120
    validate_certs: false
  register: existing_service_object

- name: "Append service object name"
  ansible.builtin.set_fact:
    service: "{{ service + [{'name': existing_service_object.json.results[0].name}] }}"
  when:
    - existing_service_object.json.results != []

- name: "Ansible uri : POST create service object - {{ rule_item }}"
  ansible.builtin.uri:
    url: "{{ cred_url }}cmdb/firewall.service/custom?vdom={{ rule.vdom }}"
    method: POST
    headers:
      Authorization: "Bearer {{ cred_api_token }}"
    body_format: json
    body: "{{ lookup('template', '../templates/service_object_payload/service_object_payload.j2') }}"
    status_code: 200
    timeout: 120
    validate_certs: false
    return_content: true
  register: new_service_object_response
  ignore_errors: true
  vars:
    service_name: "{{ rule_item | replace('/','_') | string }}"
    service_protocol: "{{ rule_item.split('/')[0] | string }}"
    service_port: "{{ rule_item.split('/')[1] | regex_replace('^0+', '') | string }}"
  when: 
    - existing_service_object.json.results == []

- name: "Ansible uri : POST create service object (retry) - {{ rule_item }}"
  ansible.builtin.uri:
    url: "{{ cred_url }}cmdb/firewall.service/custom?vdom={{ rule.vdom }}"
    method: POST
    headers:
      Authorization: "Bearer {{ cred_api_token }}"
    body_format: json
    body: "{{ lookup('template', '../templates/service_object_payload/service_object_payload.j2') }}"
    status_code: 200
    timeout: 120
    validate_certs: false
    return_content: true
  register: new_service_object_response_retry
  vars:
    service_name: "{{ rule_item | replace('/','_') | string }}_Automation"
    service_protocol: "{{ rule_item.split('/')[0] | string }}"
    service_port: "{{ rule_item.split('/')[1] | regex_replace('^0+', '') | string }}"
  when:
    - existing_service_object.json.results == []
    - new_service_object_response is failed

- name: "Set fact new service object name"
  ansible.builtin.set_fact:
    service: "{{ service + [{'name': rule_item | replace('/','_')}] }}"
  when: 
    - existing_service_object.json.results == []
    - new_service_object_response is not failed
    - new_service_object_response.status == 200

- name: "Set fact new service object name (retry)"
  ansible.builtin.set_fact:
    service: "{{ service + [{'name': rule_item | replace('/','_') + '_Automation'}] }}"
  when:
    - existing_service_object.json.results == []
    - new_service_object_response is failed
    - new_service_object_response_retry.status == 200
